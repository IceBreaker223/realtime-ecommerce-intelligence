name: Verify portfolio
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Start clean stack and verify deterministic demo
        run: python scripts/manage.py demo
      - name: Unit, database, Spark, API, and SQL checks
        run: python scripts/manage.py check
      - name: Crash recovery and replay
        run: python scripts/manage.py recovery
      - name: Measured small workload
        run: python scripts/manage.py benchmark --count 100 --rate 10
      - name: Install browser test tools
        run: |
          python -m pip install -r tests/requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Browser tests and screenshots
        run: python tests/dashboard_smoke.py
      - name: Save service logs
        if: always()
        run: |
          mkdir -p runtime/evidence
          docker compose logs --no-color > runtime/evidence/services.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            runtime/evidence/
            runtime/dashboard/
            runtime/evaluation/
      - name: Stop services without deleting volumes
        if: always()
        run: docker compose stop
