services:
  storage-init:
    image: python:3.11-slim@sha256:da047cb8f9d1d98e5c070f5300ba9f7274e33b8fc0e5be5ed88740aed1b95ba9
    user: "0:0"
    volumes:
      - ${KAFKA_STORAGE:-kafka_data}:/storage/kafka
      - ${SPARK_STORAGE:-spark_checkpoints}:/storage/spark
    command: ["python", "-c", "import os; os.chown('/storage/kafka',1000,1000); os.chmod('/storage/kafka',0o770); os.chown('/storage/spark',185,185); os.chmod('/storage/spark',0o770)"]
  kafka:
    # Verified local Kafka 4.3.1 image, pinned for reproducibility.
    image: apache/kafka@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    depends_on:
      storage-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:${KAFKA_PORT:-9092}

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kafka-logs
    volumes:
      - ${KAFKA_STORAGE:-kafka_data}:/tmp/kafka-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
  kafka-init:
    image: apache/kafka@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command: ["--bootstrap-server", "kafka:19092", "--create", "--if-not-exists", "--topic", "ecommerce-orders", "--partitions", "3", "--replication-factor", "1"]

  postgres:
    image: postgres:17@sha256:f4c66b820c6f974249089d3d16d86a3698eae11e8746eb6644b2271031e91232
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  spark:
    build: ./streaming
    image: ecommerce-spark:4.2.0
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      HOME: /tmp
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SPARK_CHECKPOINT_DIR: /opt/spark-checkpoints/analytics-v1
      TZ: UTC
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce_password}
    volumes:
      - ${SPARK_STORAGE:-spark_checkpoints}:/opt/spark-checkpoints
    command: >
      /opt/spark/bin/spark-submit
      --conf spark.jars.ivy=/tmp/.ivy2
      --packages org.apache.spark:spark-sql-kafka-0-10_2.13:4.2.0
      /opt/spark-apps/spark_kafka_stream.py

  detector:
    build: ./detection
    image: ecommerce-detector:0.1.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce_password}
    restart: unless-stopped

  api:
    build: ./api
    image: ecommerce-api:0.1.0
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce_password}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=6)"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 20s

  tools:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: tools/Dockerfile
    image: ecommerce-tools:0.1.0
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce_password}
      API_URL: http://api:8000
      PYTHONIOENCODING: utf-8
    volumes:
      - ./runtime:/app/runtime
    command: ["python", "-m", "scripts.demo"]

  db-consumer:
    build:
      context: .
      dockerfile: tools/Dockerfile
    image: ecommerce-tools:0.1.0
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce_password}
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"
    command: ["python", "-m", "producer.db_consumer"]

volumes:
  postgres_data:
  kafka_data:
  spark_checkpoints:
